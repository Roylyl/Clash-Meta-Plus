# Adapted from Clash Meta for Android issue forms for Clash Meta Plus, 2026-09-13.
name: "[简体中文] 错误报告"
description: "反馈 Clash Meta Plus 独立衍生版本的问题"
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢您在百忙之中填写此错误报告。

        注意: 请务必在上方文本框的 `[BUG]` **之后**填写清晰明了的标题。

        注意：这里不提供像是代理服务器之类的服务，请不要反馈非应用自身引起的问题。

        此表单用于 Clash Meta Plus 独立衍生版本。上游项目不负责本定制版本的维护。
        附件中请删除订阅链接、令牌、密码、服务器地址及个人信息。
  - type: textarea
    id: description
    attributes:
      label: "描述此错误"
      description: "请清晰简洁的描述你遇到的错误。"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: "如何复现该错误"
      description: "复现步骤:"
      value: |
        步骤 1: ...
        步骤 2: ...
        步骤 3: ...
        ...
    validations:
      required: true
  - type: textarea
    id: device-info
    attributes:
      label: "设备信息"
      description: |
        输入您正在使用的设备信息。

        例子:
        - 机型: Pixel 4
        - 系统类型: MIUI/AOSP
        - Android 版本: 10
      value: |
        - 机型:
        - 系统类型:
        - Android 版本:
    validations:
      required: true
  - type: textarea
    id: app-info
    attributes:
      label: "应用信息"
      description: |
        输入您正在使用的应用信息。

        例子:
        ```
        - 版本: 17.01
        - 安装包文件名: cmfa-17.01-meta-arm64-v8a-release.apk
        - 应用来源: 本地构建 / 本仓库
        ```
      value: |
        - 版本:
        - 安装包文件名:
        - 应用来源:
    validations:
      required: true
  - type: textarea
    id: configure
    attributes:
      render: yml
      label: "最小化脱敏配置（可选）"
      description: |
        仅提供复现问题所需的设置，不要上传完整订阅。
        删除密码、令牌、订阅链接、服务器地址和个人信息，优先使用虚构的最小示例。
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      render: raw
      label: "日志"
      description: |
        仅粘贴相关的脱敏日志，删除密码、令牌、网址、服务器地址和个人信息。

        提示: 请使用应用内的 `Logcat` 或 `adb logcat` 捕获日志. `adb logcat` 能更好地帮助侦测问题.
    validations:
      required: false
  - type: textarea
    id: screenshot
    attributes:
      label: "屏幕截图"
      description: "如果适用，请在此粘贴或上传屏幕截图。"
      placeholder: "可选"
  - type: textarea
    id: additional
    attributes:
      label: "附加信息"
      description: "其他的可能与改错误相关的信息。"
      placeholder: "可选"
