# Adapted from Clash Meta for Android issue forms for Clash Meta Plus, 2026-09-13.
name: "[简体中文] 功能请求"
description: "向 Clash Meta Plus 独立衍生版本提出功能建议"
title: "[Feature Request] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢您在百忙之中填写此功能请求报告。

        注意: 请务必在上方文本框的 `[Feature Request]` **之后**填写清晰明了的标题。

        此表单用于 Clash Meta Plus 独立衍生版本。上游项目不负责本定制版本的维护。
        附件中请删除订阅链接、令牌、密码、服务器地址及个人信息。
  - type: textarea
    id: "description"
    attributes:
      label: "功能描述"
      description: |
        简介明了的描述此功能。
    validations:
      required: true
  - type: textarea
    id: "additional"
    attributes:
      label: "附加信息"
      description: |
        与此功能相关的其他附加信息。
