# Adapted from Clash Meta for Android issue forms for Clash Meta Plus, 2026-09-13.
name: "[English] Feature Request"
description: "Suggest an improvement to this independent Clash Meta Plus fork"
title: "[Feature Request] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this feature request!

        NOTE: Be sure to put a clear and concise title **AFTER** `[Feature Request]` in the text box above.

        This form is for Clash Meta Plus, an independent fork. Upstream projects do not maintain this custom version.
        Remove subscription URLs, tokens, credentials, server addresses, and personal information from attachments.
  - type: textarea
    id: "description"
    attributes:
      label: "Feature Description"
      description: |
        A clear and concise description of the feature.
    validations:
      required: true
  - type: textarea
    id: "additional"
    attributes:
      label: "Additional"
      description: |
        Add any other context or screenshots about the feature request here.
